<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fitness friends</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --page: #E4E1D8;
    --dot: rgba(44, 44, 42, 0.28);
    --card: #FAF9F5;
    --ink: #2C2C2A;
    --ink-2: #5F5E5A;
    --ink-3: #888780;
    --tile: #ECEAE3;
    --tile-hover: #DEDBD2;
    --focus: #378ADD;
    --danger: #A32D2D;

    --note: #FFF1A8;
    --note-ink: #4A3D00;
    --note-ink-2: #6B5A00;
    --note-tape: #F7E27A;
    --note-border: #B39B1F;
    --note-hover: #F5E48C;
    --note-active: #EDD96E;

    --ring: #97C459;
    --ring-track: #E8EEDF;
    --ring-text: #3B6D11;

    --tile-size: 28px;
    --tile-gap: 8px;
    --stroke: 4.5px; /* streak lines and goal rings */
    --cal-pad-x: 12px;
    --arrow: 32px;

    /* Same colors in light and dark mode. */
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    min-height: 100vh;
    padding: 40px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background-color: var(--page);
    background-image: radial-gradient(var(--dot) 1.1px, transparent 1.5px);
    background-size: 18px 18px;
    background-position: 9px 9px;
  }

  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 36px;
  }

  /* ---------- Sticky note ---------- */

  .note {
    position: relative;
    flex: none;
    width: 230px;
    max-width: 100%;
    padding: 22px 20px 16px;
    background: var(--note);
    color: var(--note-ink);
    border-radius: 2px;
    transform: rotate(-2deg);
  }

  .note::before { /* tape */
    content: "";
    position: absolute;
    top: -8px;
    left: 50%;
    width: 70px;
    height: 18px;
    background: var(--note-tape);
    opacity: 0.75;
    transform: translateX(-50%) rotate(3deg);
  }

  .note-label { font-size: 12px; color: var(--note-ink-2); }
  .hand { font-family: "Patrick Hand", cursive; }
  .note-when { font-size: 28px; line-height: 1.1; }
  .note-when.first { margin-top: 4px; }
  .note.past .note-when { text-decoration: line-through; color: var(--note-ink-2); }
  .note-empty { font-size: 26px; line-height: 1.15; margin-top: 2px; }
  .note-msg {
    margin-top: 8px;
    font-size: 18px;
    line-height: 1.25;
    color: var(--note-ink-2);
    overflow-wrap: anywhere;
  }

  .note-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 10px;
  }

  .note-btn {
    font: inherit;
    font-size: 13px;
    color: var(--note-ink);
    background: transparent;
    border: 0.5px solid var(--note-border);
    border-radius: 6px;
    padding: 4px 12px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .note-btn:hover { background: var(--note-hover); }
  .note-btn:active { background: var(--note-active); transform: scale(0.98); }
  .note-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  .note-form label { display: block; font-size: 12px; color: var(--note-ink-2); }
  .note-form input {
    display: block;
    width: 100%;
    margin: 4px 0 10px;
    padding: 6px 8px;
    font: inherit;
    font-size: 14px;
    color: var(--note-ink);
    background: rgba(255, 255, 255, 0.6);
    border: 0.5px solid var(--note-border);
    border-radius: 6px;
  }
  .note-form input:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; }
  .note-error { font-size: 13px; color: var(--danger); }

  /* ---------- Calendar ---------- */

  .cal {
    position: relative;
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--card);
    border-radius: 18px;
    /* Bottom padding is the side gap (padding + arrow + 4px gap + 6px inset) less 10px. */
    padding: 48px var(--cal-pad-x) calc(var(--cal-pad-x) + var(--arrow));
  }

  .arrow {
    flex: none;
    width: var(--arrow);
    height: var(--arrow);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--ink-3);
    cursor: pointer;
  }
  .arrow:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .arrow.is-hidden { visibility: hidden; }

  .month { padding: 0 6px; }

  .month-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 14px;
  }
  .month-title { margin: 0; font-size: 16px; font-weight: 500; }
  .month-count { font-size: 13px; color: var(--ink-2); }

  .grid {
    /* Its own stacking context, so streak lines can sit behind the tiles. */
    position: relative;
    z-index: 0;
    display: grid;
    /* Seven days, then the weekly goal column with a little extra space. */
    grid-template-columns: repeat(7, var(--tile-size)) calc(var(--tile-size) + 4px);
    grid-auto-rows: var(--tile-size);
    gap: var(--tile-gap);
  }

  .weekday {
    align-self: center;
    font-size: 11px;
    color: var(--ink-3);
    text-align: center;
  }

  .tile {
    position: relative;
    width: var(--tile-size);
    height: var(--tile-size);
    padding: 0;
    border: 0;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font: inherit;
    font-size: 11px;
    line-height: 1;
    color: var(--ink-2);
    background: var(--tile);
    cursor: pointer;
    user-select: none;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .tile:hover { background: var(--tile-hover); }
  .tile.on { background: var(--on); color: var(--on-text); }
  .tile.on:hover { background: var(--on-hover); }
  .tile.today { box-shadow: 0 0 0 1.5px var(--card), 0 0 0 3px var(--ink); }
  .tile:focus-visible { outline: none; box-shadow: 0 0 0 1.5px var(--card), 0 0 0 3px var(--focus); }

  /* ---------- Streaks ---------- */

  /* The line to the next day, drawn when both days are marked. It grows out of
     whichever tile was just clicked (--grow-from) and sits behind the tiles. */
  .tile::after {
    content: "";
    position: absolute;
    z-index: -1;
    left: calc(100% - 1px);
    top: calc(50% - var(--stroke) / 2);
    width: calc(var(--tile-gap) + 2px);
    height: var(--stroke);
    background: var(--on);
    transform: scaleX(0);
    transform-origin: var(--grow-from, left) center;
    transition: transform 0.28s cubic-bezier(0.3, 0.7, 0.4, 1);
    pointer-events: none;
  }
  .tile.joined::after { transform: scaleX(1); }

  .goal {
    width: var(--tile-size);
    height: var(--tile-size);
    justify-self: end;
  }
  .goal svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .goal .track { fill: none; stroke: var(--ring-track); stroke-width: var(--stroke); }
  .goal .fill {
    fill: none;
    stroke: var(--ring);
    stroke-width: var(--stroke);
    stroke-linecap: round;
    transition: stroke-dashoffset 0.45s cubic-bezier(0.3, 0.7, 0.4, 1), opacity 0.2s ease;
  }
  .goal .count { font-size: 11px; fill: var(--ink-2); }
  .goal.met .count { fill: var(--ring-text); font-weight: 500; }

  /* Starts with the girls' high five but is quicker. */
  @keyframes goal-pulse {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.18); }
    70%  { transform: scale(0.96); }
    100% { transform: scale(1); }
  }
  .goal.pulse { animation: goal-pulse 0.45s ease-out; }

  /* Loading and switching months shouldn't animate. */
  .grid.instant .tile,
  .grid.instant .tile::after,
  .grid.instant .goal .fill { transition: none; }

  @media (prefers-reduced-motion: reduce) {
    .tile, .tile::after, .goal .fill { transition: none; }
    .goal.pulse { animation: none; }
  }

  /* ---------- Girls ---------- */

  /* Two pixel-art girls perched on the calendar's top edge, above the day count. */
  .girls {
    position: absolute;
    bottom: 100%;
    right: calc(var(--cal-pad-x) + var(--arrow) + 10px);
    display: flex;
    align-items: flex-end;
    gap: 16px;
    pointer-events: none;
  }

  .girl { display: block; transform-origin: 50% 100%; }
  .girl svg { display: block; overflow: visible; }
  .girl .eye { transform-box: fill-box; transform-origin: center; }
  .girl .happy, .girl .arm-up, .girl .spark { display: none; }
  .girl .spark { transform-box: fill-box; transform-origin: center; }

  /* Set for a moment after a day is marked: a high five across the gap. */
  .girls.cheer .eye, .girls.cheer .arm-down { display: none; }
  .girls.cheer .happy, .girls.cheer .arm-up, .girls.cheer .spark { display: inline; }

  @media (prefers-reduced-motion: no-preference) {
    .girl svg { animation: girl-bob 1.6s steps(2) infinite; }
    .girl + .girl svg { animation-delay: -0.8s; }
    .girl .eye { animation: girl-blink 4.6s infinite; }
    .girl + .girl .eye { animation-duration: 5.9s; animation-delay: -2s; }

    /* Stop bobbing so the hands line up. */
    .girls.cheer .girl svg { animation: none; }
    .girls.cheer .girl { animation: girl-bounce 1s steps(2); }
    .girls.cheer .spark { animation: girl-spark 1s steps(2) forwards; }
  }

  @keyframes girl-bob {
    to { transform: translateY(-1.5px); }
  }

  @keyframes girl-blink {
    0%, 94%, 100% { transform: scaleY(1); }
    97% { transform: scaleY(0.1); }
  }

  @keyframes girl-bounce {
    0%, 100% { transform: none; }
    20%, 40% { transform: translateY(-4px); }
  }

  @keyframes girl-spark {
    0% { opacity: 0; transform: scale(0.5); }
    15% { opacity: 1; transform: scale(0.8); }
    35% { opacity: 1; transform: scale(1.2); }
    60%, 100% { opacity: 0; transform: scale(1.4); }
  }

  /* ---------- Misc ---------- */

  .demo {
    max-width: 420px;
    margin: 28px 0 0;
    font-size: 12px;
    color: var(--ink-2);
    text-align: center;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    max-width: calc(100vw - 32px);
    padding: 8px 14px;
    font-size: 13px;
    color: #fff;
    background: var(--ink);
    border-radius: 8px;
    transform: translateX(-50%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }

  /* Extra room above the calendar for the girls. */
  @media (min-width: 681px) {
    body { padding-top: 72px; }
  }

  @media (max-width: 680px) {
    .stage { flex-direction: column; gap: 76px; }
  }

  /* Smaller tiles so the goal column fits on narrow phones. */
  @media (max-width: 400px) {
    :root { --cal-pad-x: 8px; --arrow: 24px; --tile-size: 26px; --tile-gap: 6px; }
  }
</style>
</head>
<body>

<main class="stage">
  <section class="note" id="note" aria-label="Next workout">
    <div id="note-view"></div>
    <form class="note-form" id="note-form" hidden novalidate>
      <label for="note-when">Next workout</label>
      <input id="note-when" type="datetime-local">
      <label for="note-text">Note</label>
      <input id="note-text" type="text" maxlength="60" placeholder="see you tomorrow">
      <div class="note-error" id="note-error" role="alert"></div>
      <div class="note-actions">
        <button type="button" class="note-btn" id="note-cancel">Cancel</button>
        <button type="submit" class="note-btn">Save</button>
      </div>
    </form>
  </section>

  <section class="cal" id="cal" aria-label="Workout calendar">
    <div class="girls" id="girls" aria-hidden="true"></div>
    <button type="button" class="arrow" id="prev" aria-label="Previous month">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6l6 6"/></svg>
    </button>
    <div class="month">
      <div class="month-head">
        <h1 class="month-title" id="month-title"></h1>
        <span class="month-count" id="month-count"></span>
      </div>
      <div class="grid" id="grid"></div>
    </div>
    <button type="button" class="arrow" id="next" aria-label="Next month">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6l-6 6"/></svg>
    </button>
  </section>
</main>

<p class="demo" id="demo" hidden>
  Demo mode: changes are saved in this browser only. Add your Supabase URL and anon key
  at the top of the script in index.html to share them.
</p>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// Fill these in from Supabase: Project Settings → API.
// The anon key is meant to be public; never put the service_role key here.
const SUPABASE_URL = "https://bhbglntlyzmemzsvtmut.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_mStW4Cxt_neYzEu_reH3Hw_G8I7KsHG";

// Months the calendar can show, oldest first. Months are 1-based.
const MONTHS = [
  { year: 2026, month: 9,  color: "#7F77DD", text: "#EEEDFE", hover: "#534AB7" }, // September, purple
  { year: 2026, month: 10, color: "#EF9F27", text: "#412402", hover: "#BA7517" }, // October, orange
];

const DEFAULT_NOTE = "see you tomorrow";

// ---------- Helpers ----------

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const dateKey = (year, month, day) => `${year}-${pad(month)}-${pad(day)}`;
const daysIn = ({ year, month }) => new Date(year, month, 0).getDate();
const firstWeekday = ({ year, month }) => new Date(year, month - 1, 1).getDay();

function todayKey() {
  const t = new Date();
  return dateKey(t.getFullYear(), t.getMonth() + 1, t.getDate());
}

// Rows for the longest month, so the card keeps its size when switching.
const ROWS = Math.max(...MONTHS.map((m) => Math.ceil((firstWeekday(m) + daysIn(m)) / 7)));

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

// "2026-10-04T07:00" in local time, for <input type="datetime-local">.
function toLocalInput(date) {
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

let toastTimer;
function toast(message) {
  const node = $("toast");
  node.textContent = message;
  node.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => node.classList.remove("show"), 4000);
}

// ---------- Storage ----------
// Supabase when configured; otherwise this browser's localStorage, so the page
// still works for local testing (open two tabs to see changes sync).

function createStore() {
  const configured = !SUPABASE_URL.startsWith("YOUR_") && !SUPABASE_ANON_KEY.startsWith("YOUR_");
  return configured ? supabaseStore() : localStore();
}

function supabaseStore() {
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return {
    demo: false,

    // Every day, not just the months on screen, so weeks that span two months
    // count both. It's at most 365 rows a year.
    async loadDays() {
      const { data, error } = await db.from("workout_days").select("day, worked_out");
      if (error) throw error;
      return Object.fromEntries(data.map((row) => [row.day, row.worked_out]));
    },

    async setDay(day, workedOut) {
      const { error } = await db
        .from("workout_days")
        .upsert({ day, worked_out: workedOut, updated_at: new Date().toISOString() });
      if (error) throw error;
    },

    async loadNext() {
      const { data, error } = await db
        .from("next_workout")
        .select("starts_at, note")
        .eq("id", 1)
        .single();
      if (error) throw error;
      return data;
    },

    async setNext(startsAt, note) {
      const { error } = await db
        .from("next_workout")
        .update({ starts_at: startsAt, note, updated_at: new Date().toISOString() })
        .eq("id", 1);
      if (error) throw error;
    },

    subscribe({ onDay, onNext }) {
      db.channel("tracker")
        .on("postgres_changes", { event: "*", schema: "public", table: "workout_days" },
          ({ new: row }) => row && row.day && onDay(row.day, row.worked_out))
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "next_workout" },
          ({ new: row }) => onNext(row))
        .subscribe();
    },
  };
}

function localStore() {
  const read = (key, fallback) => {
    try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
  };
  const write = (key, value) => {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  };
  return {
    demo: true,
    async loadDays() { return read("wt-days", {}); },
    async setDay(day, workedOut) { write("wt-days", { ...read("wt-days", {}), [day]: workedOut }); },
    async loadNext() { return read("wt-next", { starts_at: null, note: DEFAULT_NOTE }); },
    async setNext(startsAt, note) { write("wt-next", { starts_at: startsAt, note }); },
    subscribe({ onAllDays, onNext }) {
      // Fires in other tabs of this browser when one tab writes.
      window.addEventListener("storage", (e) => {
        if (e.key === "wt-days") onAllDays(read("wt-days", {}));
        if (e.key === "wt-next") onNext(read("wt-next", {}));
      });
    },
  };
}

// ---------- State ----------

const store = createStore();
const days = {}; // "YYYY-MM-DD" -> true for workout days
let next = { starts_at: null, note: DEFAULT_NOTE };
let current = initialMonthIndex();
let shownToday = todayKey();

// The current month if it's in MONTHS, otherwise the nearest end of the list.
function initialMonthIndex() {
  const t = new Date();
  const now = t.getFullYear() * 12 + t.getMonth() + 1;
  const index = MONTHS.findIndex((m) => m.year * 12 + m.month === now);
  if (index >= 0) return index;
  const last = MONTHS.at(-1);
  return now > last.year * 12 + last.month ? MONTHS.length - 1 : 0;
}

// Newly marked days, from either person, make the girls high five.
function setDay(day, workedOut) {
  if (workedOut && !days[day]) cheer();
  if (workedOut) days[day] = true;
  else delete days[day];
  updateCalendar({ animate: true, changed: day });
}

function isPast() {
  return Boolean(next.starts_at) && new Date(next.starts_at) < new Date();
}

// ---------- Calendar ----------

// The month is built once, then updated in place so the tiles, streak lines
// and goal rings can animate between states.

const GOAL = 3;            // workouts a week
const RING_R = 10.5;       // in the ring's 28-unit viewBox
const RING_LENGTH = 2 * Math.PI * RING_R;
const SVG_NS = "http://www.w3.org/2000/svg";

let tiles = [];            // { key, el, col, nextKey } for each day of the month
let goals = [];            // { el, fill, count, keys, start, future, cnt } for each week row

function svg(tag, attrs) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [name, value] of Object.entries(attrs)) node.setAttribute(name, value);
  return node;
}

function goalRing() {
  const box = el("div", "goal");
  box.setAttribute("role", "img");
  const ring = svg("svg", { viewBox: "0 0 28 28" });
  ring.append(svg("circle", { class: "track", cx: 14, cy: 14, r: RING_R }));
  const fill = svg("circle", {
    class: "fill", cx: 14, cy: 14, r: RING_R,
    "stroke-dasharray": RING_LENGTH, "stroke-dashoffset": RING_LENGTH,
    transform: "rotate(-90 14 14)",
  });
  const count = svg("text", { class: "count", x: 14, y: 18, "text-anchor": "middle" });
  ring.append(fill, count);
  box.append(ring);
  box.addEventListener("animationend", () => box.classList.remove("pulse"));
  return { el: box, fill, count, cnt: null };
}

function buildCalendar() {
  const m = MONTHS[current];
  const first = firstWeekday(m);
  const count = daysIn(m);
  const today = todayKey();

  const cal = $("cal");
  cal.style.setProperty("--on", m.color);
  cal.style.setProperty("--on-text", m.text);
  cal.style.setProperty("--on-hover", m.hover);

  $("month-title").textContent = new Date(m.year, m.month - 1, 1)
    .toLocaleDateString("en-US", { month: "long", year: "numeric" });

  const grid = $("grid");
  grid.replaceChildren();
  for (const letter of ["S", "M", "T", "W", "T", "F", "S"]) {
    const node = el("div", "weekday", letter);
    node.setAttribute("aria-hidden", "true");
    grid.append(node);
  }
  grid.append(el("div")); // no header over the goal column

  tiles = [];
  goals = [];
  for (let row = 0; row < ROWS; row++) {
    // The Sunday to Saturday week this row shows, including days from the
    // months either side.
    const keys = [];
    for (let col = 0; col < 7; col++) {
      const date = new Date(m.year, m.month - 1, 1 - first + row * 7 + col);
      keys.push(dateKey(date.getFullYear(), date.getMonth() + 1, date.getDate()));
      const d = row * 7 + col - first + 1;
      if (d < 1 || d > count) {
        grid.append(el("div"));
        continue;
      }
      const key = keys[col];
      const label = date.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
      const tile = el("button", "tile" + (key === today ? " today" : ""), d);
      tile.type = "button";
      tile.dataset.day = key;
      tile.title = label;
      tile.setAttribute("aria-label", label);
      grid.append(tile);
      // Lines only join days in the same week row.
      const nextKey = col < 6 && d < count ? dateKey(m.year, m.month, d + 1) : null;
      tiles.push({ key, el: tile, nextKey });
    }

    // A ring for every week that has a day in this month.
    if (row * 7 - first + 1 > count) {
      grid.append(el("div"));
      continue;
    }
    const goal = goalRing();
    goal.keys = keys;
    goal.start = new Date(m.year, m.month - 1, 1 - first + row * 7);
    goal.future = keys[0] > today;
    goals.push(goal);
    grid.append(goal.el);
  }

  $("prev").classList.toggle("is-hidden", current === 0);
  $("next").classList.toggle("is-hidden", current === MONTHS.length - 1);
  updateCalendar();
}

// `animate` is for a single change someone just made; loading and switching
// months update instantly. `changed` is the day that was clicked.
function updateCalendar({ animate = false, changed = null } = {}) {
  const grid = $("grid");
  if (!animate) grid.classList.add("instant");

  let marked = 0;
  for (const tile of tiles) {
    const on = Boolean(days[tile.key]);
    if (on) marked++;
    tile.el.classList.toggle("on", on);
    tile.el.setAttribute("aria-pressed", String(on));

    if (!tile.nextKey) continue;
    const joined = on && Boolean(days[tile.nextKey]);
    // Grow out of the clicked tile; shrink back into the one still marked.
    if (changed === tile.key) tile.el.style.setProperty("--grow-from", joined ? "left" : "right");
    if (changed === tile.nextKey) tile.el.style.setProperty("--grow-from", joined ? "right" : "left");
    tile.el.classList.toggle("joined", joined);
  }

  for (const goal of goals) {
    const cnt = goal.keys.filter((key) => days[key]).length;
    const met = cnt >= GOAL;
    goal.fill.style.strokeDashoffset = RING_LENGTH * (1 - Math.min(cnt / GOAL, 1));
    goal.fill.style.opacity = cnt > 0 ? 1 : 0;
    goal.count.textContent = goal.future && cnt === 0 ? "" : cnt;
    goal.el.classList.toggle("met", met);
    const week = goal.start.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    goal.el.setAttribute("aria-label",
      `Week of ${week}: ${cnt} workout${cnt === 1 ? "" : "s"}${met ? ", goal met" : ""}`);

    // Pulse whenever a new day brings the week to the goal or beyond, starting
    // with the girls' high five.
    if (animate && goal.cnt !== null && cnt > goal.cnt && met) {
      goal.el.classList.remove("pulse");
      void goal.el.offsetWidth; // restart the pulse if it's already running
      goal.el.classList.add("pulse");
    }
    goal.cnt = cnt;
  }

  $("month-count").textContent = `${marked} / ${daysIn(MONTHS[current])} days`;

  if (!animate) {
    // Let the browser apply the new state before turning transitions back on.
    requestAnimationFrame(() => requestAnimationFrame(() => grid.classList.remove("instant")));
  }
}

async function toggleDay(day) {
  const workedOut = !days[day];
  setDay(day, workedOut);
  try {
    await store.setDay(day, workedOut);
  } catch (error) {
    console.error(error);
    setDay(day, !workedOut);
    toast("Couldn't save that day. Try again.");
  }
}

$("grid").addEventListener("click", (e) => {
  const tile = e.target.closest(".tile");
  if (tile) toggleDay(tile.dataset.day);
});

$("prev").addEventListener("click", () => {
  if (current > 0) { current--; buildCalendar(); }
});

$("next").addEventListener("click", () => {
  if (current < MONTHS.length - 1) { current++; buildCalendar(); }
});

// ---------- Girls ----------

// Pixel-art sprites, one character per 4px pixel:
// h hair, s skin, k cheek, e eye, t hair tie, c top, p shorts,
// a the inner arm, which is hidden while it's raised for the high five.
// `reach` is the raised arm, as [column, row] pixels outside the sprite;
// the two hands meet in the 16px gap between the girls.
const GIRLS = [
  {
    top: "#2F6E48", // dark green
    rows: ["....hhhhhh..", "...hhhhhhhh.", ".thhhhhhhhhh", "hhhssssssssh", "hhsssessesss", "hh.ssssssss.",
      ".h.skssssks.", "....ssssss..", "....cccccc..", "..sccccccccs", "..s.ssssss.a", "..s.pppppp.a",
      "....pppppp..", "....ss..ss..", "...sss..sss."],
    reach: [[12, 8], [13, 7], [13, 6]],
    spark: true,
  },
  {
    top: "#8F8E89", // grey
    rows: ["hh......hh", "hhhhhhhhhh", ".hhhhhhhh.", ".ssssssss.", ".ssessess.", ".ssssssss.",
      ".skssssks.", "..ssssss..", "..cccccc..", "sccccccccs", "a.ssssss.s", "a.pppppp.s",
      "..pppppp..", "..ss..ss..", ".sss..sss."],
    reach: [[-1, 8], [-2, 7], [-2, 6]],
  },
];
const SPARK_COLOR = "#EF9F27";
const GIRL_COLORS = { h: "#1E1B1A", s: "#F2CDB0", k: "#E8857A", e: "#2C2C2A", p: "#232120" };

function girlSvg({ top, rows, reach, spark }) {
  const colors = { ...GIRL_COLORS, t: top, c: top };
  const px = (x, y, color, className = "", h = 4, dy = 0) =>
    `<rect${className ? ` class="${className}"` : ""} x="${x * 4}" y="${y * 4 + dy}" width="4" height="${h}" fill="${color}"/>`;
  let rects = "";
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === ".") return;
    if (ch === "e") {
      // Skin behind the eye shows while it blinks; the dash is the happy eye.
      rects += px(x, y, colors.s) + px(x, y, colors.e, "eye") + px(x, y, colors.e, "happy", 2, 1);
    } else if (ch === "a") {
      rects += px(x, y, colors.s, "arm-down");
    } else {
      rects += px(x, y, colors[ch]);
    }
  }));
  for (const [x, y] of reach) rects += px(x, y, colors.s, "arm-up");
  if (spark) {
    // A burst above the hands, centred on the middle of the gap.
    const bits = [[55, 12, 2, 7], [49, 16, 2, 2], [47, 14, 2, 2], [61, 16, 2, 2], [63, 14, 2, 2]];
    rects += `<g class="spark">${bits.map(([x, y, w, h]) =>
      `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${SPARK_COLOR}"/>`).join("")}</g>`;
  }
  const w = rows[0].length * 4;
  const h = rows.length * 4;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges">${rects}</svg>`;
}

function renderGirls() {
  $("girls").innerHTML = GIRLS.map((girl) => `<span class="girl">${girlSvg(girl)}</span>`).join("");
}

let cheerTimer;

function cheer() {
  const girls = $("girls");
  girls.classList.remove("cheer");
  void girls.offsetWidth; // restart the high five if it's already running
  girls.classList.add("cheer");
  clearTimeout(cheerTimer);
  cheerTimer = setTimeout(() => girls.classList.remove("cheer"), 1000);
}

// ---------- Sticky note ----------

function renderNote() {
  const view = $("note-view");
  const at = next.starts_at ? new Date(next.starts_at) : null;
  const past = isPast();
  $("note").classList.toggle("past", past);

  view.replaceChildren(el("div", "note-label", past ? "Past workout" : "Next workout"));
  if (at) {
    const weekday = at.toLocaleDateString("en-US", { weekday: "long" });
    view.append(el("div", "hand note-when first", `${weekday} ${pad(at.getMonth() + 1)}/${pad(at.getDate())}`));
    view.append(el("div", "hand note-when",
      at.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZoneName: "short" })));
  } else {
    view.append(el("div", "hand note-empty", "Nothing planned yet"));
  }
  if (next.note) view.append(el("div", "hand note-msg", next.note));

  const actions = el("div", "note-actions");
  const edit = el("button", "note-btn", at ? "Edit" : "Set");
  edit.type = "button";
  edit.id = "note-edit";
  edit.addEventListener("click", openForm);
  actions.append(edit);
  view.append(actions);
}

function openForm() {
  $("note-when").value = next.starts_at ? toLocalInput(new Date(next.starts_at)) : "";
  $("note-text").value = next.note ?? "";
  $("note-error").textContent = "";
  $("note-view").hidden = true;
  $("note-form").hidden = false;
  $("note-when").focus();
}

function closeForm() {
  $("note-form").hidden = true;
  $("note-view").hidden = false;
  $("note-edit").focus();
}

$("note-cancel").addEventListener("click", closeForm);

$("note-form").addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeForm();
});

$("note-when").addEventListener("input", () => { $("note-error").textContent = ""; });

$("note-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const when = $("note-when").value;
  if (!when) {
    $("note-error").textContent = "Pick a date and time first";
    return;
  }
  const previous = next;
  // datetime-local is local wall time; store it as a UTC moment.
  next = { starts_at: new Date(when).toISOString(), note: $("note-text").value.trim() };
  renderNote();
  closeForm();
  try {
    await store.setNext(next.starts_at, next.note);
  } catch (error) {
    console.error(error);
    next = previous;
    renderNote();
    toast("Couldn't save the next workout. Try again.");
  }
});

// ---------- Start ----------

async function init() {
  renderGirls();
  buildCalendar();
  renderNote();
  if (store.demo) $("demo").hidden = false;

  store.subscribe({
    onDay: (day, workedOut) => setDay(day, workedOut),
    onAllDays: (all) => {
      for (const key of Object.keys(days)) delete days[key];
      for (const [key, value] of Object.entries(all)) if (value) days[key] = true;
      updateCalendar({ animate: true });
    },
    onNext: (row) => {
      next = { starts_at: row.starts_at ?? null, note: row.note ?? "" };
      renderNote();
    },
  });

  try {
    const [loadedDays, loadedNext] = await Promise.all([store.loadDays(), store.loadNext()]);
    for (const [key, value] of Object.entries(loadedDays)) if (value) days[key] = true;
    if (loadedNext) next = { starts_at: loadedNext.starts_at ?? null, note: loadedNext.note ?? "" };
    updateCalendar();
    renderNote();
  } catch (error) {
    console.error(error);
    toast("Couldn't load workouts. Check your connection and refresh.");
  }

  // Once a minute: grey out a passed workout, and move the "today" ring at midnight.
  setInterval(() => {
    if (isPast() !== $("note").classList.contains("past")) renderNote();
    if (todayKey() !== shownToday) {
      shownToday = todayKey();
      buildCalendar();
    }
  }, 60_000);
}

init();
</script>
